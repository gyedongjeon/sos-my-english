[project]
name = "sos-my-english-backend"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # faster-whisper 1.2 passes an av.open() argument that PyAV 17+ removed.
    "av<17",
    "certifi>=2026.10.23",
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "kokoro-onnx>=0.6.1",
    "litellm>=1.110.2",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
